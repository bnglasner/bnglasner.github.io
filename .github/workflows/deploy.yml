name: Deploy site

on:
  push:
    branches:
      - main
    paths:
      - "assets/**"
      - "_sass/**"
      - "_scripts/**"
      - "bin/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "purgecss.config.js"
      - "requirements.txt"
      - "!lighthouse_results/**"
      - "!CONTRIBUTING.md"
      - "!CUSTOMIZE.md"
      - "!FAQ.md"
      - "!INSTALL.md"
      - "!README.md"
  pull_request:
    branches:
      - main
    paths:
      - "assets/**"
      - "_sass/**"
      - "_scripts/**"
      - "bin/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "purgecss.config.js"
      - "requirements.txt"
      - "!lighthouse_results/**"
      - "!CONTRIBUTING.md"
      - "!CUSTOMIZE.md"
      - "!FAQ.md"
      - "!INSTALL.md"
      - "!README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # JamesIves pushes the built site to the gh-pages branch
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip" # caching pip dependencies
      - name: Install Python tools 🧰
        run: pip3 install --upgrade pyyaml
      # Gate 1: the same schema checks pre-commit runs locally, so a web edit or
      # a --no-verify commit cannot ship a malformed _data file or papers.bib.
      - name: Validate data schemas 📋
        run: |
          python3 bin/check_writing_authors.py
          python3 bin/validate_data.py
      - name: Install and Build 🔧
        run: |
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      # Gate 2: internal links over the production build, before anything is
      # published. (Replaces the post-deploy broken-links-site.yml rebuild.)
      - name: Check internal links 🔗
        run: python3 bin/check_internal_links.py _site
      # The Font Awesome webfonts are subset (bin/subset_fontawesome.sh); an icon
      # missing from bin/fontawesome-icons.txt would render as an empty box.
      - name: Check Font Awesome subset 🔣
        run: python3 bin/check_fa_icons.py _site
      - name: Deploy 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
