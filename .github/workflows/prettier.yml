name: Prettier code formatter

# Runs on pushes to main as well as PRs: most changes land as direct commits,
# so a PR-only check never ran (last run before this change: 2026-02-23).
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      # npm ci installs the prettier + liquid-plugin versions pinned in
      # package-lock.json, so CI formats exactly like the local hook.
      - name: Install Prettier 💾
        run: npm ci
      - name: Prettier Check 🔎
        id: prettier
        run: npx prettier . --check --ignore-path .prettierignore
      - name: Create diff 📝
        # https://docs.github.com/en/actions/learn-github-actions/expressions#failure
        if: ${{ failure() && steps.prettier.conclusion == 'failure' }}
        run: |
          npx prettier . --write --ignore-path .prettierignore
          git diff -- . ':(exclude)package-lock.json' ':(exclude)package.json' > diff.txt
          npm install -g diff2html-cli
          diff2html -i file -s side -F diff.html -- diff.txt
      - name: Upload html diff ⬆️
        if: ${{ failure() && steps.prettier.conclusion == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: HTML Diff
          path: diff.html
          retention-days: 7
