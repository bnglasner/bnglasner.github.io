name: Render a CV

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rendercv:
    name: RenderCV (manual only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RenderCV
        run: |
          pip install -r requirements.txt
      - name: Detect RenderCV-compatible input
        id: detect
        run: |
          cv_file=$(find _data -maxdepth 1 -type f \( -name "cv.yaml" -o -name "cv.yml" \) | head -n 1)
          if [ -z "$cv_file" ]; then
            echo "compatible=false" >> "$GITHUB_OUTPUT"
            echo "reason=No _data/cv.yml file found" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          is_mapping=$(python -c 'import sys,yaml; data=yaml.safe_load(open(sys.argv[1], "r", encoding="utf-8")); print("true" if isinstance(data, dict) else "false")' "$cv_file")

          echo "cv_file=$cv_file" >> "$GITHUB_OUTPUT"
          echo "compatible=$is_mapping" >> "$GITHUB_OUTPUT"

          if [ "$is_mapping" != "true" ]; then
            echo "reason=_data/cv.yml top-level YAML is not a mapping (RenderCV expects a mapping)" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip RenderCV for canonical list-style cv.yml
        if: steps.detect.outputs.compatible != 'true'
        run: |
          echo "Skipping RenderCV: ${{ steps.detect.outputs.reason }}"
          echo "This repository now publishes CV PDFs from the private LaTeX pipeline."
      - name: RenderCV
        if: steps.detect.outputs.compatible == 'true'
        run: |
          rendercv_dir=$(find assets -maxdepth 1 -type d -name "rendercv")
          if [ -z "$rendercv_dir" ]; then
            echo "No RenderCV config directory found!"
            exit 1
          fi

          settings=$(find "$rendercv_dir" -maxdepth 1 -type f \( -name "settings.yaml" -o -name "settings.yml" \))
          if [ -z "$settings" ]; then
            echo "Missing RenderCV config file!"
            exit 1
          fi

          rendercv render "${{ steps.detect.outputs.cv_file }}" --settings "$settings"
          rm -f assets/rendercv/rendercv_output/*.typ
      - name: Upload rendercv_output as an artifact
        if: steps.detect.outputs.compatible == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: RenderCV Output
          path: assets/rendercv/rendercv_output
