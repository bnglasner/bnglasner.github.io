name: Update Google Scholar Citations

# Refreshes _data/citations.yml from Google Scholar. The file is not rendered on
# the site; it feeds the bib-and-citations-sync skill's triage of Scholar-only
# titles. Weekly is plenty: counts move slowly and Scholar throttles CI runners.
on:
  schedule:
    - cron: "17 6 * * 1" # Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write # commit the refreshed citations.yml

concurrency:
  group: update-citations
  cancel-in-progress: false

jobs:
  update-citations:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # A failure here fails the run. The previous version swallowed the exit
      # code, so four weeks of import errors and timeouts all showed green.
      - name: Run citation update script
        run: timeout 120 python bin/update_scholar_citations.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- _data/citations.yml; then
            echo "ℹ️ _data/citations.yml unchanged; nothing to commit." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add _data/citations.yml
          git commit -m "Update Google Scholar citations"
          git push
          echo "✅ _data/citations.yml updated and committed." | tee -a "$GITHUB_STEP_SUMMARY"
