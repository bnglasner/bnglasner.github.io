# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # Local hook: enforce that every entry in _data/writing.yml carries an authors
  # field. Closes the integrity gap flagged in
  # docs/audits/2026-05-03-portfolio-deep-dive.md.
  - repo: local
    hooks:
      - id: check-writing-authors
        name: writing.yml authors-field integrity check
        entry: python3 bin/check_writing_authors.py
        language: system
        files: ^_data/writing\.yml$
        pass_filenames: false

      # Broader schema validation per .claude/rules/schema-invariants.md:
      # writing.yml, media_page.yml, socials.yml, papers.bib <-> venues.yml.
      - id: validate-data-schemas
        name: _data and papers.bib schema validation
        entry: python3 bin/validate_data.py
        language: system
        files: ^(_data/|_bibliography/)
        pass_filenames: false
