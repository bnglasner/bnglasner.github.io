# Custom socials. jekyll-socials (george-gca, v0.0.6) handles unknown keys
# via its `else` branch as long as the entry is a hash with both `url` and
# `logo`. `logo` accepts either a Font Awesome class (no file extension) or
# an asset path with a known image extension (png, jpg, jpeg, gif, webp,
# svg). Bundled FA 7 supplies fa-tiktok, fa-threads, and fa-newspaper.
# Substack uses a stand-in icon until a brand SVG lands in assets/img/.
