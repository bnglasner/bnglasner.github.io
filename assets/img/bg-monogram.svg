<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Benjamin Glasner">
  <!--
    Site mark: "BG" in Newsreader at wght 600, on an accent-teal rule.

    The letterforms are OUTLINED PATHS, not <text>. A favicon SVG is loaded
    outside the page, so it cannot use the site's self-hosted Newsreader — a
    live <text> element would silently fall back to a system serif. Do not
    convert this back to <text>.

    Colors are the 2026 design tokens (paper-text and accent-teal) inlined,
    with the dark-mode complement behind prefers-color-scheme so the mark
    inverts in dark browser chrome instead of disappearing.

    Note: this is an XML comment, so it must never contain a double hyphen.
    Writing the token names with their leading dashes makes the whole file
    fail to parse, and a standalone SVG is parsed strictly.
  -->
  <style>
    :root {
      --ink: #1a1f24;
      --accent: #116a5f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #fcfcfa;
        --accent: #2ba694;
      }
    }
  </style>
